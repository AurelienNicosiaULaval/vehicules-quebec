name: Récupération temporaire multi-système des PDF
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --upgrade requests pypdf
      - name: Récupérer et valider les PDF
        shell: bash
        run: |
          set +e
          export PDF_OUTPUT_DIR="notes_master_math_france_${{ runner.os }}"
          python temp_multios_pdf_recovery.py > "run_${{ runner.os }}.log" 2>&1
          status=$?
          cat "run_${{ runner.os }}.log"
          exit $status
      - name: Créer l'archive
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          runner = os.environ['RUNNER_OS']
          source = f"notes_master_math_france_{runner}"
          shutil.make_archive(f"notes-master-math-france-{runner}", "zip", source)
          PY
      - name: Publier l'archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-master-math-france-${{ runner.os }}
          path: |
            notes-master-math-france-${{ runner.os }}.zip
            notes_master_math_france_${{ runner.os }}/manifest.csv
            notes_master_math_france_${{ runner.os }}/manifest.json
            run_${{ runner.os }}.log
          if-no-files-found: error
          retention-days: 3
