name: Récupération distribuée des cinq PDF finaux
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --upgrade requests pypdf
      - name: Télécharger via un bassin de relais réseau
        run: |
          set +e
          python temp_proxy_pool_pdf_recovery.py > run_proxy_pool.log 2>&1
          status=$?
          cat run_proxy_pool.log
          exit $status
      - name: Créer l'archive
        if: always()
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive("notes-master-math-france-proxy-pool", "zip", "notes_master_math_france_proxy_pool")
          PY
      - name: Publier l'archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-master-math-france-proxy-pool
          path: |
            notes-master-math-france-proxy-pool.zip
            notes_master_math_france_proxy_pool/manifest.csv
            notes_master_math_france_proxy_pool/manifest.json
            run_proxy_pool.log
          if-no-files-found: error
          retention-days: 3
