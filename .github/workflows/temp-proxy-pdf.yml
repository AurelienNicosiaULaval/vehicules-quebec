name: Récupération temporaire des PDF par relais HTTP
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --upgrade requests pypdf
      - name: Récupérer les PDF officiels par relais
        run: |
          set +e
          python temp_proxy_pdf_recovery.py > run_proxy.log 2>&1
          status=$?
          cat run_proxy.log
          exit $status
      - name: Créer l'archive
        if: always()
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive("notes-master-math-france-proxy","zip","notes_master_math_france_proxy")
          PY
      - name: Publier l'archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-master-math-france-proxy
          path: |
            notes-master-math-france-proxy.zip
            notes_master_math_france_proxy/manifest.csv
            notes_master_math_france_proxy/manifest.json
            run_proxy.log
          if-no-files-found: error
          retention-days: 3
